<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1600, height=900" />
  <title>Scene 02 — Classical Bits Deep Dive</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1600px;
      height: 900px;
      overflow: hidden;
      background: #040914;
      background-image: radial-gradient(ellipse 90% 60% at 50% 25%, #07152b 0%, #040914 65%, #020408 100%);
      color: #f8fafc;
      font-family: 'Inter', system-ui, sans-serif;
      position: relative;
    }
    .bg-canvas { position: absolute; inset: 0; width: 1600px; height: 900px; pointer-events: none; z-index: 0; }
    .stage-svg { position: absolute; inset: 0; width: 1600px; height: 900px; z-index: 1; overflow: visible; }
    .caption-bar {
      position: absolute;
      bottom: 54px;
      left: 140px;
      right: 140px;
      text-align: center;
      font-size: 28px;
      line-height: 1.6;
      color: #94a3b8;
      z-index: 3;
    }
    .hl-term {
      color: #f8fafc;
      font-weight: 700;
      display: inline-block;
      transition: color 0.3s, transform 0.3s, text-shadow 0.3s;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "animejs": "/node_modules/animejs/dist/modules/index.js"
    }
  }
  </script>
</head>
<body>
  <canvas class="bg-canvas" id="bg-canvas"></canvas>

  <svg class="stage-svg" viewBox="0 0 1600 900">
    <!-- Matched initial position from Scene 01 end: Bit 0 at (800, 380), value 1, cyan background -->
    <g transform="translate(800, 380)">
      <g id="actor-classical">
        <g id="bit-unit-0">
          <rect id="bit-glow-0" x="-68" y="-68" width="136" height="136" rx="26" fill="none" stroke="rgba(56,189,248,0.7)" stroke-width="2" opacity="0.6" />
          <rect id="bit-rect-0" x="-60" y="-60" width="120" height="120" rx="20" fill="#38bdf8" stroke="#38bdf8" stroke-width="2" />
          <text id="bit-text-0" x="0" y="10" text-anchor="middle" dominant-baseline="middle" fill="#040914" font-size="52px" font-family="'JetBrains Mono', monospace" font-weight="700">1</text>
          <text id="bit-sub-0" x="0" y="85" text-anchor="middle" fill="#475569" font-size="16px" font-family="'Inter', sans-serif">bit[0]</text>
        </g>

        <!-- Extra bits that cascade out in Scene 02 -->
        <g id="actor-extra-bits" opacity="0">
          <g id="bit-unit-1" transform="translate(220, 0)">
            <rect id="bit-glow-1" x="-68" y="-68" width="136" height="136" rx="26" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="2" opacity="0.4" />
            <rect id="bit-rect-1" x="-60" y="-60" width="120" height="120" rx="20" fill="#38bdf8" stroke="#38bdf8" stroke-width="2" />
            <text id="bit-text-1" x="0" y="10" text-anchor="middle" dominant-baseline="middle" fill="#040914" font-size="52px" font-family="'JetBrains Mono', monospace" font-weight="700">1</text>
            <text id="bit-sub-1" x="0" y="85" text-anchor="middle" fill="#475569" font-size="16px" font-family="'Inter', sans-serif">bit[1]</text>
          </g>
          <g id="bit-unit-2" transform="translate(440, 0)">
            <rect id="bit-glow-2" x="-68" y="-68" width="136" height="136" rx="26" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="2" opacity="0.4" />
            <rect id="bit-rect-2" x="-60" y="-60" width="120" height="120" rx="20" fill="#0f1e35" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
            <text id="bit-text-2" x="0" y="10" text-anchor="middle" dominant-baseline="middle" fill="#38bdf8" font-size="52px" font-family="'JetBrains Mono', monospace" font-weight="700">0</text>
            <text id="bit-sub-2" x="0" y="85" text-anchor="middle" fill="#475569" font-size="16px" font-family="'Inter', sans-serif">bit[2]</text>
          </g>
          <g id="bit-unit-3" transform="translate(660, 0)">
            <rect id="bit-glow-3" x="-68" y="-68" width="136" height="136" rx="26" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="2" opacity="0.4" />
            <rect id="bit-rect-3" x="-60" y="-60" width="120" height="120" rx="20" fill="#38bdf8" stroke="#38bdf8" stroke-width="2" />
            <text id="bit-text-3" x="0" y="10" text-anchor="middle" dominant-baseline="middle" fill="#040914" font-size="52px" font-family="'JetBrains Mono', monospace" font-weight="700">1</text>
            <text id="bit-sub-3" x="0" y="85" text-anchor="middle" fill="#475569" font-size="16px" font-family="'Inter', sans-serif">bit[3]</text>
          </g>
        </g>
      </g>
    </g>
  </svg>

  <div class="caption-bar" id="caption">
    Classical bits are completely <span class="hl-term" id="hl-deterministic">deterministic</span>. You always know the exact <span class="hl-term" id="hl-state">state</span>. Flip a bit and it moves from zero to one. Flip it again, back to zero. Every bit in your device right now is fixed at exactly one of those two values.
  </div>

  <script type="module">
    import { createTimeline } from 'animejs';

    // Particle Drift
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 1600; canvas.height = 900;
    const particles = Array.from({ length: 45 }, () => ({
      x: Math.random() * 1600, y: Math.random() * 900, r: Math.random() * 1.8 + 0.6,
      vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25,
      color: Math.random() > 0.4 ? 'rgba(56,189,248,' : 'rgba(167,139,250,',
      alpha: Math.random() * 0.35 + 0.15, phase: Math.random() * Math.PI * 2, speed: 0.015
    }));
    function draw() {
      ctx.clearRect(0, 0, 1600, 900);
      for (const p of particles) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = 1600; if (p.x > 1600) p.x = 0;
        if (p.y < 0) p.y = 900; if (p.y > 900) p.y = 0;
        p.phase += p.speed;
        const a = p.alpha + Math.sin(p.phase) * 0.1;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `${p.color}${Math.max(0.05, a)})`; ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    // Scene Timeline
    const tl = createTimeline({ autoplay: true });
    window.__sceneTimeline = tl;

    // Entrance
    tl.add('#caption', { opacity: [0, 1], translateY: [20, 0], duration: 800, ease: 'outQuart' }, 200);

    // Camera move: Bit 0 glides left, extra 3 bits slide out to form 4-bit register
    tl.add('#actor-classical', { translateX: [0, -330], duration: 1200, ease: 'inOutQuint' }, 1200);
    tl.add('#actor-extra-bits', { opacity: [0, 1], duration: 800, ease: 'outQuart' }, 1800);

    // Highlight pulses
    tl.add('#hl-deterministic', { color: [{ to: '#38bdf8' }, { to: '#f8fafc' }], scale: [1, 1.15, 1], duration: 1100, ease: 'inOutQuint' }, 5000);
    tl.add('#hl-state', { color: [{ to: '#38bdf8' }, { to: '#f8fafc' }], scale: [1, 1.15, 1], duration: 1100, ease: 'inOutQuint' }, 12000);

    // Flip 1: Bit 0 flips 1 -> 0 at 8000ms
    tl.add('#bit-rect-0', { fill: '#0f1e35', stroke: 'rgba(255,255,255,0.12)', scale: [1, 1.15, 1], duration: 450, ease: 'outBack(1.3)' }, 8000);
    tl.add('#bit-glow-0', { stroke: 'rgba(56,189,248,0.25)', opacity: 0.4, duration: 450 }, 8000);
    tl.add('#bit-text-0', { opacity: [1, 0], duration: 100, onComplete: () => { const e = document.getElementById('bit-text-0'); if(e){ e.textContent = '0'; e.style.fill = '#38bdf8'; }}}, 8080);
    tl.add('#bit-text-0', { opacity: [0, 1], duration: 180 }, 8180);

    // Flip 2: Bit 1 flips 1 -> 0 at 16000ms
    tl.add('#bit-rect-1', { fill: '#0f1e35', stroke: 'rgba(255,255,255,0.12)', scale: [1, 1.15, 1], duration: 450, ease: 'outBack(1.3)' }, 16000);
    tl.add('#bit-text-1', { opacity: [1, 0], duration: 100, onComplete: () => { const e = document.getElementById('bit-text-1'); if(e){ e.textContent = '0'; e.style.fill = '#38bdf8'; }}}, 16080);
    tl.add('#bit-text-1', { opacity: [0, 1], duration: 180 }, 16180);

    // Flip 3: Bit 2 flips 0 -> 1 at 24000ms
    tl.add('#bit-rect-2', { fill: '#38bdf8', stroke: '#38bdf8', scale: [1, 1.15, 1], duration: 450, ease: 'outBack(1.3)' }, 24000);
    tl.add('#bit-text-2', { opacity: [1, 0], duration: 100, onComplete: () => { const e = document.getElementById('bit-text-2'); if(e){ e.textContent = '1'; e.style.fill = '#040914'; }}}, 24080);
    tl.add('#bit-text-2', { opacity: [0, 1], duration: 180 }, 24180);

    // Flip 4: Bit 3 flips 1 -> 0 at 36000ms
    tl.add('#bit-rect-3', { fill: '#0f1e35', stroke: 'rgba(255,255,255,0.12)', scale: [1, 1.15, 1], duration: 450, ease: 'outBack(1.3)' }, 36000);
    tl.add('#bit-text-3', { opacity: [1, 0], duration: 100, onComplete: () => { const e = document.getElementById('bit-text-3'); if(e){ e.textContent = '0'; e.style.fill = '#38bdf8'; }}}, 36080);
    tl.add('#bit-text-3', { opacity: [0, 1], duration: 180 }, 36180);

    // Transition preparation: extra bits fold back into Bit 0 at 41500ms, Bit 0 returns to center with chromatic tension glow
    tl.add('#actor-extra-bits', { opacity: [1, 0], duration: 800, ease: 'inQuart' }, 41500);
    tl.add('#actor-classical', { translateX: [-330, 0], duration: 1400, ease: 'inOutQuint' }, 41500);
    tl.add('#bit-glow-0', { stroke: '#a78bfa', opacity: [0.4, 0.85], duration: 1400 }, 42500);
  </script>
</body>
</html>
