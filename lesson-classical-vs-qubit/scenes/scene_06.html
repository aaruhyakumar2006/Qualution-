<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1600, height=900" />
  <title>Scene 06 — Entanglement Teaser</title>
  <link rel="stylesheet" href="/node_modules/katex/dist/katex.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1600px;
      height: 900px;
      overflow: hidden;
      background: #040914;
      background-image: radial-gradient(ellipse 90% 60% at 50% 25%, #07152b 0%, #040914 65%, #020408 100%);
      color: #f8fafc;
      font-family: 'Inter', system-ui, sans-serif;
      position: relative;
    }
    .bg-canvas { position: absolute; inset: 0; width: 1600px; height: 900px; pointer-events: none; z-index: 0; }
    .stage-svg { position: absolute; inset: 0; width: 1600px; height: 900px; z-index: 1; overflow: visible; }
    .math-layer {
      position: absolute;
      left: 0; right: 0;
      top: 530px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
      pointer-events: none;
      font-size: 38px;
      color: #f8fafc;
      text-shadow: 0 2px 16px rgba(167,139,250,0.45);
    }
    .math-layer .mord, .math-layer .mbin, .math-layer .mrel, .math-layer .mopen, .math-layer .mclose {
      display: inline-block;
      transition: transform 0.2s, opacity 0.2s;
    }
    .caption-bar {
      position: absolute;
      bottom: 54px;
      left: 140px;
      right: 140px;
      text-align: center;
      font-size: 28px;
      line-height: 1.6;
      color: #94a3b8;
      z-index: 3;
    }
    .hl-term {
      color: #f8fafc;
      font-weight: 700;
      display: inline-block;
      transition: color 0.3s, transform 0.3s, text-shadow 0.3s;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "animejs": "/node_modules/animejs/dist/modules/index.js",
      "katex": "/node_modules/katex/dist/katex.mjs"
    }
  }
  </script>
</head>
<body>
  <canvas class="bg-canvas" id="bg-canvas"></canvas>

  <svg class="stage-svg" viewBox="0 0 1600 900">
    <defs>
      <radialGradient id="sphere-grad" cx="38%" cy="32%" r="62%">
        <stop offset="0%" stop-color="#0e2a52" />
        <stop offset="70%" stop-color="#061226" />
        <stop offset="100%" stop-color="#030814" />
      </radialGradient>
      <linearGradient id="link-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
        <stop offset="50%" stop-color="#a78bfa" stop-opacity="1" />
        <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
      </linearGradient>
    </defs>

    <!-- Entanglement Link Beam -->
    <g id="actor-link" opacity="0">
      <line id="link-beam-glow" x1="480" y1="330" x2="1120" y2="330" stroke="url(#link-grad)" stroke-width="6" stroke-linecap="round" opacity="0.4" />
      <line id="link-beam" x1="480" y1="330" x2="1120" y2="330" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="10,6" stroke-linecap="round" />
    </g>

    <!-- Left side: Starts as classical bit at (450, 260) and morphs into Qubit Sphere 2 at (480, 330) -->
    <g transform="translate(450, 260)">
      <g id="actor-classical-morph">
        <rect id="bit-rect-0" x="-60" y="-60" width="120" height="120" rx="20" fill="#0f1e35" stroke="#38bdf8" stroke-width="2" />
        <text id="bit-text-0" x="0" y="10" text-anchor="middle" dominant-baseline="middle" fill="#38bdf8" font-size="52px" font-family="'JetBrains Mono', monospace" font-weight="700">0</text>
      </g>
    </g>

    <!-- Qubit Sphere 2 (Morphed) -->
    <g transform="translate(480, 330)">
      <g id="actor-qubit-2" opacity="0">
        <circle cx="0" cy="0" r="110" fill="none" stroke="rgba(167,139,250,0.3)" stroke-width="1.5" />
        <circle cx="0" cy="0" r="95" fill="url(#sphere-grad)" stroke="rgba(167,139,250,0.4)" stroke-width="2" />
        <ellipse cx="0" cy="0" rx="95" ry="30" fill="none" stroke="rgba(167,139,250,0.3)" stroke-width="1.5" stroke-dasharray="4,4" />
        <ellipse cx="0" cy="0" rx="30" ry="95" fill="none" stroke="rgba(167,139,250,0.3)" stroke-width="1.5" stroke-dasharray="3,4" />
        <line x1="0" y1="-115" x2="0" y2="115" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
        <circle cx="0" cy="-95" r="5" fill="#38bdf8" />
        <text x="0" y="-126" text-anchor="middle" fill="#38bdf8" font-size="20px" font-family="'JetBrains Mono', monospace" font-weight="700">|0⟩</text>
        <circle cx="0" cy="95" r="5" fill="#a78bfa" />
        <text x="0" y="142" text-anchor="middle" fill="#a78bfa" font-size="20px" font-family="'JetBrains Mono', monospace" font-weight="700">|1⟩</text>
        <g id="qvec-2">
          <line x1="0" y1="0" x2="-62" y2="-62" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round" />
          <circle id="qdot-2" cx="-62" cy="-62" r="8" fill="#a78bfa" stroke="#ffffff" stroke-width="2" />
        </g>
      </g>
    </g>

    <!-- Qubit Sphere 1: Starts at (1150, 260) and adjusts to (1120, 330) -->
    <g transform="translate(1150, 260)">
      <g id="actor-qubit-1">
        <circle cx="0" cy="0" r="110" fill="none" stroke="rgba(56,189,248,0.22)" stroke-width="1.5" />
        <circle cx="0" cy="0" r="95" fill="url(#sphere-grad)" stroke="rgba(56,189,248,0.3)" stroke-width="2" />
        <ellipse cx="0" cy="0" rx="95" ry="30" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="1.5" stroke-dasharray="4,4" />
        <ellipse cx="0" cy="0" rx="30" ry="95" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="1.5" stroke-dasharray="3,4" />
        <line x1="0" y1="-115" x2="0" y2="115" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
        <circle cx="0" cy="-95" r="5" fill="#38bdf8" />
        <text x="0" y="-126" text-anchor="middle" fill="#38bdf8" font-size="20px" font-family="'JetBrains Mono', monospace" font-weight="700">|0⟩</text>
        <circle cx="0" cy="95" r="5" fill="#a78bfa" />
        <text x="0" y="142" text-anchor="middle" fill="#a78bfa" font-size="20px" font-family="'JetBrains Mono', monospace" font-weight="700">|1⟩</text>
        <g id="qvec-1">
          <line x1="0" y1="0" x2="62" y2="-62" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round" />
          <circle id="qdot-1" cx="62" cy="-62" r="8" fill="#00f0ff" stroke="#ffffff" stroke-width="2" />
        </g>
      </g>
    </g>
  </svg>

  <div class="math-layer" id="math-layer"></div>

  <div class="caption-bar" id="caption">
    When two <span class="hl-term" id="hl-qubits">qubits</span> interact, they can become <span class="hl-term" id="hl-entangled">entangled</span> — where measuring one instantly reveals the other across any distance.
  </div>

  <script type="module">
    import { createTimeline, stagger } from 'animejs';
    import katex from 'katex';

    // Particle Drift
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 1600; canvas.height = 900;
    const particles = Array.from({ length: 45 }, () => ({
      x: Math.random() * 1600, y: Math.random() * 900, r: Math.random() * 1.8 + 0.6,
      vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25,
      color: Math.random() > 0.4 ? 'rgba(56,189,248,' : 'rgba(167,139,250,',
      alpha: Math.random() * 0.35 + 0.15, phase: Math.random() * Math.PI * 2, speed: 0.015
    }));
    function draw() {
      ctx.clearRect(0, 0, 1600, 900);
      for (const p of particles) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = 1600; if (p.x > 1600) p.x = 0;
        if (p.y < 0) p.y = 900; if (p.y > 900) p.y = 0;
        p.phase += p.speed;
        const a = p.alpha + Math.sin(p.phase) * 0.1;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `${p.color}${Math.max(0.05, a)})`; ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    // Pre-render KaTeX Bell State equation
    const mathEl = document.getElementById('math-layer');
    katex.render('|\\Phi^+\\rangle = \\frac{|00\\rangle + |11\\rangle}{\\sqrt{2}}', mathEl, { displayMode: true, throwOnError: false });
    const symbols = mathEl.querySelectorAll('.mord, .mbin, .mrel, .mopen, .mclose');
    symbols.forEach(s => { s.style.opacity = '0'; s.style.transform = 'translateY(12px) scale(0.9)'; });

    // Scene Timeline
    const tl = createTimeline({ autoplay: true });
    window.__sceneTimeline = tl;

    // Left bit morphs into Qubit Sphere 2
    tl.add('#actor-classical-morph', { scale: [0.85, 0.1, 0], opacity: [1, 0], duration: 1300, ease: 'inOutQuint' }, 200);
    tl.add('#actor-qubit-2', { scale: [0.1, 1], opacity: [0, 1], duration: 1400, ease: 'inOutQuint' }, 400);

    // Qubit Sphere 1 shifts to balanced right position (1120, 330)
    tl.add('#actor-qubit-1', {
      translateX: [0, -30],
      translateY: [0, 70],
      scale: [0.85, 1],
      duration: 1400,
      ease: 'inOutQuint'
    }, 200);

    // Entangled Beam strikes between both spheres!
    tl.add('#actor-link', { opacity: [0, 1], duration: 800 }, 1400);
    tl.add('#link-beam', {
      strokeDashoffset: [0, -80],
      duration: 28000,
      ease: 'linear'
    }, 1400);

    // KaTeX equation enters
    tl.add(symbols, {
      opacity: [0, 1],
      translateY: [12, 0],
      scale: [0.9, 1],
      duration: 500,
      ease: 'outQuart',
      delay: stagger(90)
    }, 1600);

    // Synchronized correlated rotation
    tl.add('#qvec-1', {
      rotate: [0, 360 * 2.5],
      transformOrigin: '0px 0px',
      duration: 28000,
      ease: 'inOutSine'
    }, 1500);
    tl.add('#qvec-2', {
      rotate: [0, -360 * 2.5],
      transformOrigin: '0px 0px',
      duration: 28000,
      ease: 'inOutSine'
    }, 1500);

    // Caption entrance
    tl.add('#caption', { opacity: [0, 1], translateY: [20, 0], duration: 800, ease: 'outQuart' }, 400);

    // Highlights
    tl.add('#hl-qubits', { color: [{ to: '#38bdf8' }, { to: '#f8fafc' }], scale: [1, 1.15, 1], duration: 1100, ease: 'inOutQuint' }, 4000);
    tl.add('#hl-entangled', { color: [{ to: '#a78bfa' }, { to: '#f8fafc' }], scale: [1, 1.15, 1], duration: 1100, ease: 'inOutQuint' }, 10000);
  </script>
</body>
</html>
