<script>
// --- TIMELINE PAYLOAD (EMBEDDED) ---
const payload = {
  scenes: [
    { id: 1, text: { content: "Welcome. Today we will master Grover's Algorithm, from intuition to mathematical depth." } },
    { id: 2, text: { content: "Let's start with the Search Problem." }, explain: { title: "Classical vs Quantum Search", body: "Imagine an unsorted database of N items. Classically, finding a marked item takes O(N) queries (checking each one). Grover's algorithm uses quantum interference to find it in O(√N) queries — a provable quadratic speedup!" } },
    { id: 3, text: { content: "We define our search space size N as 2 to the power of n, where n is our number of qubits." }, math: { content: "N = 2^n, \\quad |\\psi\\rangle = \\sum_{x=0}^{N-1} \\alpha_x |x\\rangle" } },
    { id: 4, text: { content: "For our worked example, let's use 2 qubits. N = 4." }, visual: { type: "state_row" }, cursor: { target: "states-panel" } },
    { id: 5, text: { content: "Our target, the 'marked state', will be |11⟩." }, visual: { target: "|11⟩" }, cursor: { target: "|11⟩" } },
    { id: 6, text: { content: "We initialize our 2 qubits to the |00⟩ state." }, circuit: { state: "|00⟩" }, cursor: { target: "q0" } },
    { id: 7, text: { content: "Step 1: Create a uniform superposition by applying Hadamard gates to all qubits." }, circuit_animation: [{ action: "place", gate: "H", qubit: "q0" }, { action: "place", gate: "H", qubit: "q1" }] },
    { id: 8, text: { content: "The state is now an equal mix of all 4 possibilities." }, math: { content: "|s\\rangle = H^{\\otimes n}|0\\rangle^{\\otimes n} = \\frac{1}{\\sqrt{N}}\\sum |x\\rangle" }, visual: { type: "probability_bars" }, cursor: { target: "math-panel" } },
    { id: 9, text: { content: "Each state has an amplitude of +1/2, and a probability of 25%." }, qsphere: { source: "actual_statevector" }, cursor: { target: "qsphere-panel" } },
    { id: 10, text: { content: "Step 2: The Oracle. The oracle identifies the marked state and flips its phase." }, explain: { title: "Phase Oracle", body: "The oracle applies a unitary transformation U_ω. If x is the marked state, it multiplies the amplitude by -1. U_ω|x⟩ = (-1)^{f(x)}|x⟩." } },
    { id: 11, text: { content: "For |11⟩, the oracle is exactly a Controlled-Z (CZ) gate." }, circuit_animation: { action: "build_oracle" }, cursor: { target: "oracle-region" } },
    { id: 12, text: { content: "Notice the Q-Sphere! The phase of |11⟩ is flipped to negative (red), but probabilities remain unchanged at 25%." }, qsphere: { source: "actual_statevector" }, cursor: { target: "probability_11" } },
    { id: 13, text: { content: "Step 3: The Diffuser. This operator performs 'Inversion about the Mean'." }, math: { content: "D = 2|s\\rangle\\langle s| - I" } },
    { id: 14, text: { content: "It amplifies the amplitude that is far below the average (our marked state) and shrinks the others." }, circuit_animation: { action: "build_diffuser" }, cursor: { target: "diffuser-region" } },
    { id: 15, text: { content: "Look at the probabilities! |11⟩ has jumped to 100%!" }, probability: { source: "actual_simulation" }, qsphere: { source: "actual_statevector" }, cursor: { target: "prob-panel" } },
    { id: 16, text: { content: "How many iterations do we need for larger N?" }, explain: { title: "Optimal Iterations", body: "Each iteration rotates the state by 2θ toward the target. The optimal number of iterations k to reach 100% probability is: k = ⌊(π/4) * √(N/M)⌋" } },
    { id: 17, text: { content: "For N=4, k=1. Exactly one iteration! We found it in 1 query instead of 2.25 classical average." }, math: { content: "k_{opt} = \\lfloor \\frac{\\pi}{4} \\sqrt{\\frac{4}{1}} \\rfloor = 1" } },
    { id: 18, text: { content: "Step 4: Measurement. We measure the qubits to retrieve the classical answer." }, circuit_animation: { action: "measure" } },
    { id: 19, text: { content: "We get 11 with 100% certainty." }, histogram: { source: "actual_simulation" }, visual: { target: "|11⟩" }, cursor: { target: "histogram_11" } },
    { id: 20, text: { content: "Let's summarize the limitations of this algorithm." }, explain: { title: "Limitations & Practicalities", body: "<ul><li>Quadratic, not exponential speedup.</li><li>Must know exact iteration count or you over-rotate and lose probability.</li><li>Oracle construction costs gate depth, which can be noisy on NISQ hardware.</li></ul>" }, cursor: { target: "center" } },
    { id: 21, text: { content: "But on fault-tolerant hardware, this provides a massive speedup for unstructured search." }, visual: { flow: ["SUPERPOSITION", "ORACLE", "DIFFUSER", "MEASUREMENT"] } },
    { id: 22, text: { content: "That concludes the visual guide to Grover's Algorithm." } }
  ]
};

// --- ENGINE CODE (Adapted from original) ---
const $ = (id) => document.getElementById(id);
const bgCanvas = $('bg-canvas'), circuitCanvas = $('circuit-canvas'), qsphereCanvas = $('qsphere-canvas');
const titleCard = $('title-card'), workspace = $('workspace'), narrationBar = $('narration-bar');
const narrationText = $('narration-text'), teachingCursor = $('teaching-cursor');
const progressFill = $('progress-fill'), stepLabel = $('step-label');
const mathRender = $('math-render'), mathLabel = $('math-label'), statesDisplay = $('states-display');
const probBars = $('prob-bars'), histogramBars = $('histogram-bars');
const explainCard = $('explain-card'), explainTitle = $('explain-title'), explainBody = $('explain-body');
const summaryOverlay = $('summary-overlay'), summaryFlow = $('summary-flow'), endScreen = $('end-screen');
const btnMute = $('btn-mute'), btnPause = $('btn-pause'), btnRestart = $('btn-restart');

let isPaused = false, isMuted = false, currentNarrationTimeout = null, ttsUtterance = null;
const gates = []; const QUBITS = 2, WIRE_Y_START = 100, WIRE_SPACING = 70, COL_START = 120, COL_WIDTH = 65, GATE_SIZE = 40;
let stateVector = [[1,0],[0,0],[0,0],[0,0]];

function complexAdd(a, b) { return [a[0]+b[0], a[1]+b[1]]; }
function prob(c) { return c[0]*c[0] + c[1]*c[1]; }

function applyH(qubitIdx) {
  const sq = 1/Math.sqrt(2); const newState = [[0,0],[0,0],[0,0],[0,0]];
  for (let i = 0; i < 4; i++) {
    const bit = (i >> (1 - qubitIdx)) & 1; const partner = i ^ (1 << (1 - qubitIdx));
    if (bit === 0) {
      newState[i] = complexAdd(newState[i], [stateVector[i][0]*sq, stateVector[i][1]*sq]);
      newState[i] = complexAdd(newState[i], [stateVector[partner][0]*sq, stateVector[partner][1]*sq]);
    } else {
      newState[i] = complexAdd(newState[i], [stateVector[partner][0]*sq, stateVector[partner][1]*sq]);
      newState[i] = complexAdd(newState[i], [-stateVector[i][0]*sq, -stateVector[i][1]*sq]);
    }
  }
  stateVector = newState;
}

function applyX(qubitIdx) {
  const newState = [[0,0],[0,0],[0,0],[0,0]];
  for (let i = 0; i < 4; i++) {
    const partner = i ^ (1 << (1 - qubitIdx));
    newState[i] = [stateVector[partner][0], stateVector[partner][1]];
  }
  stateVector = newState;
}

function applyCZ() { stateVector[3] = [-stateVector[3][0], -stateVector[3][1]]; }
function getProbs() { return stateVector.map(c => prob(c)); }
function resetState() { stateVector = [[1,0],[0,0],[0,0],[0,0]]; }

const bgCtx = bgCanvas.getContext('2d');
let particles = [];
function initParticles() {
  bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight; particles = [];
  const count = Math.floor((bgCanvas.width * bgCanvas.height) / 8000);
  for (let i = 0; i < count; i++) {
    particles.push({ x: Math.random() * bgCanvas.width, y: Math.random() * bgCanvas.height, vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3, r: Math.random() * 1.5 + 0.5, a: Math.random() * 0.3 + 0.05 });
  }
}
function drawParticles() {
  bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
  const grad = bgCtx.createRadialGradient(bgCanvas.width/2, bgCanvas.height/2, 0, bgCanvas.width/2, bgCanvas.height/2, bgCanvas.width * 0.7);
  grad.addColorStop(0, '#0d1225'); grad.addColorStop(1, '#060a14'); bgCtx.fillStyle = grad; bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; if (p.x < 0) p.x = bgCanvas.width; if (p.x > bgCanvas.width) p.x = 0; if (p.y < 0) p.y = bgCanvas.height; if (p.y > bgCanvas.height) p.y = 0;
    bgCtx.beginPath(); bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2); bgCtx.fillStyle = `rgba(0, 220, 255, ${p.a})`; bgCtx.fill();
  }
}

let circCtx = null;
function initCircuit() {
  const rect = circuitCanvas.parentElement.getBoundingClientRect();
  circuitCanvas.width = rect.width * window.devicePixelRatio; circuitCanvas.height = rect.height * window.devicePixelRatio;
  circuitCanvas.style.width = rect.width + 'px'; circuitCanvas.style.height = rect.height + 'px';
  circCtx = circuitCanvas.getContext('2d'); circCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
}
function drawCircuit() {
  if (!circCtx) return; const w = circuitCanvas.width / window.devicePixelRatio; const h = circuitCanvas.height / window.devicePixelRatio;
  circCtx.clearRect(0, 0, w, h);
  circCtx.font = '13px "JetBrains Mono", monospace'; circCtx.fillStyle = '#8892b0';
  for (let q = 0; q < QUBITS; q++) {
    const y = WIRE_Y_START + q * WIRE_SPACING; circCtx.fillText(`q${q}`, 24, y + 5);
    circCtx.fillStyle = '#5a6480'; circCtx.fillText(`|0⟩`, 56, y + 5); circCtx.fillStyle = '#8892b0';
  }
  const maxCol = gates.length > 0 ? Math.max(...gates.map(g => g.col)) + 2 : 4;
  const wireEnd = COL_START + maxCol * COL_WIDTH + 40;
  for (let q = 0; q < QUBITS; q++) {
    const y = WIRE_Y_START + q * WIRE_SPACING; circCtx.beginPath(); circCtx.moveTo(90, y); circCtx.lineTo(wireEnd, y);
    circCtx.strokeStyle = 'rgba(136, 146, 176, 0.3)'; circCtx.lineWidth = 1.5; circCtx.stroke();
  }
  for (const g of gates) {
    const cx = COL_START + g.col * COL_WIDTH;
    if (g.gate === 'cz') {
      const y0 = WIRE_Y_START + g.targets[0] * WIRE_SPACING; const y1 = WIRE_Y_START + g.targets[1] * WIRE_SPACING;
      circCtx.beginPath(); circCtx.moveTo(cx, y0); circCtx.lineTo(cx, y1); circCtx.strokeStyle = '#a855f7'; circCtx.lineWidth = 2; circCtx.stroke();
      for (const y of [y0, y1]) { circCtx.beginPath(); circCtx.arc(cx, y, 6, 0, Math.PI * 2); circCtx.fillStyle = '#a855f7'; circCtx.fill(); circCtx.strokeStyle = '#c084fc'; circCtx.lineWidth = 1.5; circCtx.stroke(); }
      circCtx.font = '10px "JetBrains Mono", monospace'; circCtx.fillStyle = '#c084fc'; circCtx.textAlign = 'center'; circCtx.fillText('CZ', cx, Math.min(y0, y1) - 12); circCtx.textAlign = 'start';
    } else {
      const y = WIRE_Y_START + g.targets[0] * WIRE_SPACING; const half = GATE_SIZE / 2;
      circCtx.fillStyle = 'rgba(15, 22, 40, 0.9)'; circCtx.strokeStyle = g.highlight ? '#00dcff' : 'rgba(136, 146, 176, 0.4)'; circCtx.lineWidth = g.highlight ? 2 : 1.5;
      circCtx.beginPath(); circCtx.roundRect(cx - half, y - half, GATE_SIZE, GATE_SIZE, 6); circCtx.fill(); circCtx.stroke();
      circCtx.font = '16px "JetBrains Mono", monospace'; circCtx.fillStyle = g.gate === 'h' ? '#00dcff' : g.gate === 'x' ? '#f59e0b' : '#fff';
      circCtx.textAlign = 'center'; circCtx.textBaseline = 'middle'; circCtx.fillText(g.gate.toUpperCase(), cx, y); circCtx.textAlign = 'start'; circCtx.textBaseline = 'alphabetic';
    }
  }
  const sections = [];
  if (gates.some(g => g.col === 0)) sections.push({ col: 0, label: 'SUPERPOSITION', color: '#00dcff' });
  if (gates.some(g => g.col === 1)) sections.push({ col: 1, label: 'ORACLE', color: '#a855f7' });
  if (gates.some(g => g.col >= 2)) sections.push({ col: 4, label: 'DIFFUSER', color: '#10b981' });
  circCtx.font = '9px Inter, sans-serif';
  for (const s of sections) {
    const cx = COL_START + s.col * COL_WIDTH; circCtx.fillStyle = s.color; circCtx.globalAlpha = 0.5; circCtx.textAlign = 'center'; circCtx.fillText(s.label, cx, WIRE_Y_START - 35); circCtx.textAlign = 'start'; circCtx.globalAlpha = 1;
  }
}
function addGateVisual(gate, targets, col) {
  gates.push({ gate, targets, col, highlight: false });
  if (gate === 'h') applyH(targets[0]); else if (gate === 'x') applyX(targets[0]); else if (gate === 'cz') applyCZ();
  drawCircuit();
}

let qsCtx = null;
function initQSphere() {
  const rect = qsphereCanvas.parentElement.getBoundingClientRect(); const w = 300; const h = 140;
  qsphereCanvas.width = w * window.devicePixelRatio; qsphereCanvas.height = h * window.devicePixelRatio;
  qsphereCanvas.style.width = w + 'px'; qsphereCanvas.style.height = h + 'px';
  qsCtx = qsphereCanvas.getContext('2d'); qsCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
}
function drawQSphere(amplitudes) {
  if (!qsCtx) initQSphere(); const w = 300, h = 140; const cx = w / 2, cy = h / 2, r = 50;
  qsCtx.clearRect(0, 0, w, h);
  qsCtx.beginPath(); qsCtx.arc(cx, cy, r, 0, Math.PI * 2); qsCtx.strokeStyle = 'rgba(136, 146, 176, 0.2)'; qsCtx.lineWidth = 1; qsCtx.stroke();
  qsCtx.beginPath(); qsCtx.ellipse(cx, cy, r, r * 0.3, 0, 0, Math.PI * 2); qsCtx.strokeStyle = 'rgba(136, 146, 176, 0.12)'; qsCtx.stroke();
  circCtx && (() => { qsCtx.beginPath(); qsCtx.moveTo(cx - r, cy); qsCtx.lineTo(cx + r, cy); qsCtx.moveTo(cx, cy - r); qsCtx.lineTo(cx, cy + r); qsCtx.strokeStyle = 'rgba(136, 146, 176, 0.08)'; qsCtx.stroke(); })();
  const labels = ['|00⟩', '|01⟩', '|10⟩', '|11⟩']; const angles = [Math.PI * 0.25, Math.PI * 0.75, Math.PI * 1.25, Math.PI * 1.75];
  for (let i = 0; i < 4; i++) {
    const amp = amplitudes ? amplitudes[i] : [0, 0]; const magnitude = Math.sqrt(prob(amp)); const phase = Math.atan2(amp[1], amp[0]);
    const angle = angles[i]; const dotR = Math.max(3, magnitude * 14);
    const dx = cx + Math.cos(angle) * r * 0.75; const dy = cy + Math.sin(angle) * r * 0.55;
    if (magnitude > 0.01) { qsCtx.beginPath(); qsCtx.moveTo(cx, cy); qsCtx.lineTo(dx, dy); qsCtx.strokeStyle = `rgba(0, 220, 255, ${magnitude * 0.4})`; qsCtx.lineWidth = 1; qsCtx.stroke(); }
    const hue = ((phase / Math.PI) * 180 + 360) % 360; const color = magnitude > 0.01 ? `hsl(${hue}, 80%, 60%)` : 'rgba(136, 146, 176, 0.2)';
    qsCtx.beginPath(); qsCtx.arc(dx, dy, dotR, 0, Math.PI * 2); qsCtx.fillStyle = color; qsCtx.fill();
    if (magnitude > 0.01) { qsCtx.shadowColor = color; qsCtx.shadowBlur = 8; qsCtx.fill(); qsCtx.shadowBlur = 0; }
    qsCtx.font = '10px "JetBrains Mono", monospace'; qsCtx.fillStyle = magnitude > 0.5 ? '#f0f4ff' : '#5a6480'; qsCtx.textAlign = 'center'; qsCtx.fillText(labels[i], dx, dy + dotR + 14);
    if (magnitude > 0.01) { qsCtx.fillStyle = '#8892b0'; qsCtx.font = '9px "JetBrains Mono", monospace'; const sign = amp[0] < -0.001 ? '−' : '+'; const val = Math.abs(amp[0]).toFixed(2); qsCtx.fillText(`${sign}${val}`, dx, dy - dotR - 6); }
    qsCtx.textAlign = 'start';
  }
}

function renderProbBars(probs) {
  const labels = ['|00⟩', '|01⟩', '|10⟩', '|11⟩']; probBars.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const pct = (probs[i] * 100); const row = document.createElement('div'); row.className = 'prob-row'; const isTarget = i === 3;
    row.innerHTML = `<span class="prob-label">${labels[i]}</span><div class="prob-track"><div class="prob-fill ${isTarget ? 'target-fill' : ''}" style="width: 0%" data-target="${pct}"></div></div><span class="prob-value">${pct.toFixed(1)}%</span>`;
    probBars.appendChild(row);
  }
  requestAnimationFrame(() => { requestAnimationFrame(() => { probBars.querySelectorAll('.prob-fill').forEach(el => { el.style.width = el.dataset.target + '%'; }); }); });
}

function renderHistogram(counts) {
  const labels = ['|00⟩', '|01⟩', '|10⟩', '|11⟩']; const total = Object.values(counts).reduce((a,b) => a+b, 0); histogramBars.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const key = ['00','01','10','11'][i]; const count = counts[key] || 0; const pct = total > 0 ? (count / total) * 100 : 0;
    const col = document.createElement('div'); col.className = 'hist-col'; const isWinner = count === total && count > 0;
    col.innerHTML = `<div class="hist-count">${count}</div><div class="hist-bar-track"><div class="hist-bar ${isWinner ? 'winner' : ''}" style="height: 0%" data-target="${pct}"></div></div><div class="hist-label">${labels[i]}</div>`;
    histogramBars.appendChild(col);
  }
  requestAnimationFrame(() => { requestAnimationFrame(() => { histogramBars.querySelectorAll('.hist-bar').forEach(el => { el.style.height = el.dataset.target + '%'; }); }); });
}

function narrate(text) {
  return new Promise((resolve) => {
    narrationBar.classList.add('visible'); narrationText.innerHTML = ''; const blinkSpan = document.createElement('span'); blinkSpan.className = 'narration-cursor-blink';
    let i = 0; const speed = 35; if (currentNarrationTimeout) clearInterval(currentNarrationTimeout);
    
    let isTypingDone = false;
    let isSpeechDone = isMuted || !window.speechSynthesis;
    
    const checkDone = () => {
      if (isTypingDone && isSpeechDone) {
        setTimeout(resolve, 400);
      }
    };

    if (!isMuted && window.speechSynthesis) {
      window.speechSynthesis.cancel(); ttsUtterance = new SpeechSynthesisUtterance(text); ttsUtterance.rate = 0.95;
      const voices = window.speechSynthesis.getVoices(); const preferred = voices.find(v => v.name.includes('Google') && v.lang.startsWith('en')) || voices.find(v => v.lang.startsWith('en-US'));
      if (preferred) ttsUtterance.voice = preferred; 
      
      ttsUtterance.onend = () => { isSpeechDone = true; checkDone(); };
      setTimeout(() => { if (!isSpeechDone) { isSpeechDone = true; checkDone(); } }, text.length * 100 + 1000);
      window.speechSynthesis.speak(ttsUtterance);
    }
    
    currentNarrationTimeout = setInterval(() => {
      if (isPaused) return;
      if (i < text.length) { narrationText.textContent = text.substring(0, i + 1); narrationText.appendChild(blinkSpan); i++; } else { clearInterval(currentNarrationTimeout); currentNarrationTimeout = null; narrationText.textContent = text; isTypingDone = true; checkDone(); }
    }, speed);
  });
}

function moveCursor(x, y) { return new Promise((resolve) => { teachingCursor.style.transform = `translate(${x}px, ${y}px)`; setTimeout(resolve, 700); }); }
function getCursorTarget(name) {
  const circRect = circuitCanvas.getBoundingClientRect(); const rightRect = document.getElementById('right-panel').getBoundingClientRect();
  switch (name) {
    case 'center': return { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    case 'gate-H': return { x: circRect.left + 40, y: circRect.top + 40 };
    case 'qubit-q0': return { x: circRect.left + COL_START, y: circRect.top + WIRE_Y_START };
    case 'qubit-q1': return { x: circRect.left + COL_START, y: circRect.top + WIRE_Y_START + WIRE_SPACING };
    case 'circuit-center': return { x: circRect.left + circRect.width * 0.4, y: circRect.top + circRect.height * 0.4 };
    case 'oracle-region': return { x: circRect.left + COL_START + COL_WIDTH, y: circRect.top + WIRE_Y_START + WIRE_SPACING / 2 };
    case 'diffuser-region': return { x: circRect.left + COL_START + COL_WIDTH * 4, y: circRect.top + WIRE_Y_START + WIRE_SPACING / 2 };
    case 'math-panel': return { x: rightRect.left + 30, y: rightRect.top + 120 };
    case 'prob-panel': return { x: rightRect.left + 30, y: rightRect.top + 260 };
    case 'qsphere-panel': return { x: rightRect.left + 30, y: rightRect.top + 400 };
    case 'histogram-panel': return { x: rightRect.left + 30, y: rightRect.top + 500 };
    case 'states-panel': return { x: rightRect.left + 30, y: rightRect.top + 30 };
    case 'measure-btn': return { x: circRect.left + circRect.width - 60, y: circRect.top + 30 };
    default: return { x: window.innerWidth / 2, y: window.innerHeight / 2 };
  }
}

function showCard(id) { document.getElementById(id).classList.add('visible'); }
function hideCard(id) { document.getElementById(id).classList.remove('visible'); }
function showMath(latex, label) { try { katex.render(latex, mathRender, { displayMode: true, throwOnError: false }); } catch (e) { mathRender.textContent = latex; } mathLabel.textContent = label || ''; showCard('math-card'); }
function showExplain(title, body) { explainTitle.textContent = title; explainBody.innerHTML = body; explainCard.classList.add('visible'); }
function hideExplain() { explainCard.classList.remove('visible'); }
function showStates(highlight) {
  const states = ['|00⟩', '|01⟩', '|10⟩', '|11⟩']; statesDisplay.innerHTML = '';
  for (let i = 0; i < 4; i++) { const badge = document.createElement('div'); badge.className = 'state-badge'; if (highlight === i) badge.classList.add('target'); badge.textContent = states[i]; statesDisplay.appendChild(badge); }
  showCard('states-card');
}
function dimNonTargetStates() { const badges = statesDisplay.querySelectorAll('.state-badge'); badges.forEach((b, i) => { if (i !== 3) b.classList.add('dimmed'); }); }
function setProgress(pct) { progressFill.style.width = pct + '%'; }
function setStepLabel(text) { stepLabel.textContent = text; stepLabel.classList.add('visible'); }
function wait(ms) { return new Promise((resolve) => { const check = () => { if (!isPaused) { resolve(); } else { setTimeout(check, 100); } }; setTimeout(check, ms); }); }

function showSummaryFlow(steps) {
  return new Promise(async (resolve) => {
    summaryFlow.innerHTML = '';
    for (let i = 0; i < steps.length; i++) {
      if (i > 0) { const arrow = document.createElement('div'); arrow.className = 'summary-arrow'; arrow.textContent = '↓'; summaryFlow.appendChild(arrow); }
      const step = document.createElement('div'); step.className = 'summary-step'; step.innerHTML = `<span class="step-icon">★</span>${steps[i]}`; summaryFlow.appendChild(step);
    }
    summaryOverlay.classList.add('visible');
    const allSteps = summaryFlow.querySelectorAll('.summary-step'); const allArrows = summaryFlow.querySelectorAll('.summary-arrow');
    for (let i = 0; i < allSteps.length; i++) { await wait(350); allSteps[i].classList.add('visible'); if (i > 0 && allArrows[i-1]) allArrows[i-1].classList.add('visible'); }
    await wait(3000); resolve();
  });
}
function showEndScreen() {
  return new Promise(async (resolve) => {
    summaryOverlay.classList.remove('visible'); workspace.classList.remove('visible'); narrationBar.classList.remove('visible'); teachingCursor.style.display = 'none';
    endScreen.classList.add('visible');
    const taglines = endScreen.querySelectorAll('.end-taglines span');
    for (const t of taglines) { await wait(500); t.classList.add('visible'); }
    await wait(3000); resolve();
  });
}

async function runTimeline() {
  gates.length = 0; resetState(); teachingCursor.style.display = 'block'; teachingCursor.style.transform = 'translate(-100px, -100px)';
  document.querySelectorAll('.panel-card').forEach(c => c.classList.remove('visible'));
  hideExplain(); narrationBar.classList.remove('visible'); workspace.classList.remove('visible'); titleCard.classList.remove('visible'); endScreen.classList.remove('visible'); summaryOverlay.classList.remove('visible');
  
  const scenes = payload.scenes;
  const totalSteps = scenes.length; let currentStep = 0;

  for (const scene of scenes) {
    currentStep++; setProgress((currentStep / totalSteps) * 100); setStepLabel(`Scene ${scene.id}`);
    if (scene.id === 1) { titleCard.classList.add('visible'); await wait(1500); titleCard.classList.remove('visible'); workspace.classList.add('visible'); initCircuit(); initQSphere(); await wait(400); }
    if (scene.id === 21) { workspace.classList.remove('visible'); narrationBar.classList.remove('visible'); teachingCursor.style.display = 'none'; }
    if (scene.id === 22) { showEndScreen(); }

    let cursorPromise = Promise.resolve();
    if (scene.cursor) {
      let targetName = 'center'; if (scene.cursor.target) targetName = scene.cursor.target;
      const targetMap = { '|11⟩': 'states-panel', 'q0': 'qubit-q0', 'probability_11': 'prob-panel', 'math-panel': 'math-panel', 'oracle-region': 'oracle-region', 'diffuser-region': 'diffuser-region', 'qsphere-panel': 'qsphere-panel', 'histogram_11': 'histogram-panel', 'states-panel': 'states-panel', 'center': 'center' };
      const t = getCursorTarget(targetMap[targetName] || 'center'); cursorPromise = moveCursor(t.x, t.y);
    }

    if (scene.explain) { showExplain(scene.explain.title, scene.explain.body); } else { hideExplain(); }

    let visualPromise = Promise.resolve();
    if (scene.visual) {
      if (scene.visual.type === 'state_row') showStates(-1);
      if (scene.visual.target === '|11⟩') { showStates(3); dimNonTargetStates(); }
      if (scene.visual.type === 'probability_bars') { renderProbBars(getProbs()); showCard('prob-card'); }
      if (scene.visual.flow) { visualPromise = showSummaryFlow(scene.visual.flow); }
    }

    if (scene.circuit && scene.circuit.state === '|00⟩') drawCircuit();

    let animPromise = Promise.resolve();
    if (scene.circuit_animation) {
      animPromise = (async () => {
        let anims = Array.isArray(scene.circuit_animation) ? scene.circuit_animation : [scene.circuit_animation];
        for (const anim of anims) {
          if (anim.action === 'place' && anim.gate === 'H') { addGateVisual('h', [anim.qubit === 'q0' ? 0 : 1], 0); await wait(200); }
          else if (anim.action === 'build_oracle') { addGateVisual('cz', [0,1], 1); }
          else if (anim.action === 'build_diffuser') { addGateVisual('h', [0], 2); await wait(100); addGateVisual('h', [1], 2); await wait(100); addGateVisual('x', [0], 3); await wait(100); addGateVisual('x', [1], 3); await wait(100); addGateVisual('cz', [0, 1], 4); await wait(100); addGateVisual('x', [0], 5); await wait(100); addGateVisual('x', [1], 5); await wait(100); addGateVisual('h', [0], 6); await wait(100); addGateVisual('h', [1], 6); }
        }
      })();
    }

    if (scene.math) { showMath(scene.math.content, scene.math.label); }
    if (scene.probability && scene.probability.source === 'actual_simulation') { renderProbBars(getProbs()); showCard('prob-card'); }
    if (scene.qsphere) { drawQSphere(stateVector); showCard('qsphere-card'); }
    if (scene.histogram) { const counts = { '00': 0, '01': 0, '10': 0, '11': 1000 }; renderHistogram(counts); showCard('histogram-card'); }

    let narratePromise = Promise.resolve();
    if (scene.text && scene.text.content) { narratePromise = narrate(scene.text.content); }
    
    await Promise.all([cursorPromise, visualPromise, animPromise, narratePromise]);
    await wait(600);
  }
}

btnMute.addEventListener('click', () => { isMuted = !isMuted; btnMute.textContent = isMuted ? '🔇' : '🔊'; btnMute.classList.toggle('active', isMuted); if (isMuted && window.speechSynthesis) window.speechSynthesis.cancel(); });
btnPause.addEventListener('click', () => { isPaused = !isPaused; btnPause.textContent = isPaused ? '▶' : '⏸'; btnPause.classList.toggle('active', isPaused); if (isPaused && window.speechSynthesis) window.speechSynthesis.pause(); else if (!isPaused && window.speechSynthesis) window.speechSynthesis.resume(); });
btnRestart.addEventListener('click', () => { location.reload(); });

function bgLoop() { drawParticles(); requestAnimationFrame(bgLoop); }
window.addEventListener('load', () => {
  if (window.speechSynthesis) { window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); }; }
  initParticles(); bgLoop(); setTimeout(() => { runTimeline(); }, 800);
});
window.addEventListener('resize', () => {
  initParticles();
  if (workspace.classList.contains('visible')) { initCircuit(); drawCircuit(); initQSphere(); drawQSphere(stateVector); }
});
</script>
