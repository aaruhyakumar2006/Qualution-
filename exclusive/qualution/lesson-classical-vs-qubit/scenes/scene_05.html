<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1600, height=900" />
  <title>Scene 05 — Side-by-Side Comparison: Bit vs Qubit</title>
  <link rel="stylesheet" href="/node_modules/katex/dist/katex.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1600px;
      height: 900px;
      overflow: hidden;
      background: #040914;
      background-image: radial-gradient(ellipse 90% 60% at 50% 25%, #07152b 0%, #040914 65%, #020408 100%);
      color: #f8fafc;
      font-family: 'Inter', system-ui, sans-serif;
      position: relative;
    }
    .bg-canvas { position: absolute; inset: 0; width: 1600px; height: 900px; pointer-events: none; z-index: 0; }
    .stage-svg { position: absolute; inset: 0; width: 1600px; height: 900px; z-index: 1; overflow: visible; }
    .caption-bar {
      position: absolute;
      bottom: 54px;
      left: 140px;
      right: 140px;
      text-align: center;
      font-size: 28px;
      line-height: 1.6;
      color: #94a3b8;
      z-index: 3;
    }
    .hl-term {
      color: #f8fafc;
      font-weight: 700;
      display: inline-block;
      transition: color 0.3s, transform 0.3s, text-shadow 0.3s;
    }
    .cmp-card-bg { fill: rgba(15, 30, 53, 0.88); stroke: rgba(255,255,255,0.08); stroke-width: 1.5; rx: 16; }
    .cmp-header { font-size: 14px; font-family: 'Inter', sans-serif; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; fill: #38bdf8; }
    .cmp-cell-label { font-size: 16px; font-family: 'Inter', sans-serif; font-weight: 600; fill: #64748b; }
    .cmp-cell-val { font-size: 16px; font-family: 'JetBrains Mono', monospace; fill: #cbd5e1; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "animejs": "/node_modules/animejs/dist/modules/index.js"
    }
  }
  </script>
</head>
<body>
  <canvas class="bg-canvas" id="bg-canvas"></canvas>

  <svg class="stage-svg" viewBox="0 0 1600 900">
    <defs>
      <radialGradient id="sphere-grad" cx="38%" cy="32%" r="62%">
        <stop offset="0%" stop-color="#0e2a52" />
        <stop offset="70%" stop-color="#061226" />
        <stop offset="100%" stop-color="#030814" />
      </radialGradient>
    </defs>

    <!-- Classical Bit glides in from Left to (450, 260) -->
    <g transform="translate(450, 260)">
      <g id="actor-classical" opacity="0">
        <rect id="bit-rect-0" x="-60" y="-60" width="120" height="120" rx="20" fill="#0f1e35" stroke="#38bdf8" stroke-width="2" />
        <text id="bit-text-0" x="0" y="10" text-anchor="middle" dominant-baseline="middle" fill="#38bdf8" font-size="52px" font-family="'JetBrains Mono', monospace" font-weight="700">0</text>
        <text x="0" y="90" text-anchor="middle" fill="#38bdf8" font-size="16px" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="0.05em">CLASSICAL BIT</text>
      </g>
    </g>

    <!-- Qubit Sphere starts centered at (800, 320) and glides to Right (1150, 260) -->
    <g transform="translate(1150, 260)">
      <g id="actor-qubit-1">
        <circle cx="0" cy="0" r="110" fill="none" stroke="rgba(56,189,248,0.22)" stroke-width="1.5" />
        <circle cx="0" cy="0" r="95" fill="url(#sphere-grad)" stroke="rgba(56,189,248,0.3)" stroke-width="2" />
        <ellipse cx="0" cy="0" rx="95" ry="30" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="1.5" stroke-dasharray="4,4" />
        <ellipse cx="0" cy="0" rx="30" ry="95" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="1.5" stroke-dasharray="3,4" />
        <line x1="0" y1="-115" x2="0" y2="115" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
        <circle cx="0" cy="-95" r="5" fill="#38bdf8" />
        <text x="0" y="-126" text-anchor="middle" fill="#38bdf8" font-size="20px" font-family="'JetBrains Mono', monospace" font-weight="700">|0⟩</text>
        <circle cx="0" cy="95" r="5" fill="#a78bfa" />
        <text x="0" y="142" text-anchor="middle" fill="#a78bfa" font-size="20px" font-family="'JetBrains Mono', monospace" font-weight="700">|1⟩</text>
        <g id="qvec-1">
          <line x1="0" y1="0" x2="62" y2="-62" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round" />
          <circle id="qdot-1" cx="62" cy="-62" r="8" fill="#00f0ff" stroke="#ffffff" stroke-width="2" />
        </g>
        <text x="0" y="180" text-anchor="middle" fill="#a78bfa" font-size="16px" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="0.05em">QUANTUM QUBIT</text>
      </g>
    </g>

    <!-- Side-by-Side Comparison HUD Card -->
    <g transform="translate(420, 560)">
      <g id="actor-cmp-table" opacity="0">
        <rect class="cmp-card-bg" x="0" y="0" width="760" height="150" />
        <text class="cmp-header" x="40" y="38">Property</text>
        <text class="cmp-header" x="290" y="38">Classical Bit</text>
        <text class="cmp-header" x="530" y="38">Quantum Qubit</text>

        <line x1="30" y1="52" x2="730" y2="52" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

        <text class="cmp-cell-label" x="40" y="84">Possible states</text>
        <text class="cmp-cell-val" x="290" y="84">0 or 1</text>
        <text class="cmp-cell-val" x="530" y="84" fill="#38bdf8">α|0⟩ + β|1⟩</text>

        <text class="cmp-cell-label" x="40" y="120">On measurement</text>
        <text class="cmp-cell-val" x="290" y="120">Unchanged</text>
        <text class="cmp-cell-val" x="530" y="120" fill="#a78bfa">Collapses to 0 or 1</text>
      </g>
    </g>
  </svg>

  <div class="caption-bar" id="caption">
    Side by side, the difference is clear. A classical <span class="hl-term" id="hl-bit">bit</span> is a single switch with two discrete positions. A <span class="hl-term" id="hl-qubit">qubit</span> is a sphere of possibilities — holding a continuum of states until <span class="hl-term" id="hl-measurement">measured</span>.
  </div>

  <script type="module">
    import { createTimeline } from 'animejs';

    // Particle Drift
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 1600; canvas.height = 900;
    const particles = Array.from({ length: 45 }, () => ({
      x: Math.random() * 1600, y: Math.random() * 900, r: Math.random() * 1.8 + 0.6,
      vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25,
      color: Math.random() > 0.4 ? 'rgba(56,189,248,' : 'rgba(167,139,250,',
      alpha: Math.random() * 0.35 + 0.15, phase: Math.random() * Math.PI * 2, speed: 0.015
    }));
    function draw() {
      ctx.clearRect(0, 0, 1600, 900);
      for (const p of particles) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = 1600; if (p.x > 1600) p.x = 0;
        if (p.y < 0) p.y = 900; if (p.y > 900) p.y = 0;
        p.phase += p.speed;
        const a = p.alpha + Math.sin(p.phase) * 0.1;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `${p.color}${Math.max(0.05, a)})`; ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    // Scene Timeline
    const tl = createTimeline({ autoplay: true });
    window.__sceneTimeline = tl;

    // CAMERA SPLIT: Qubit slides to Right (1150, 260), Classical bit glides in from Left (450, 260)
    tl.add('#actor-qubit-1', {
      translateX: [-350, 0],
      translateY: [60, 0],
      scale: [1, 0.85],
      duration: 1500,
      ease: 'inOutQuint'
    }, 200);

    tl.add('#actor-classical', {
      translateX: [-350, 0],
      opacity: [0, 1],
      duration: 1500,
      ease: 'inOutQuint'
    }, 300);

    // Comparison card slides UP
    tl.add('#actor-cmp-table', {
      opacity: [0, 1],
      translateY: [40, 0],
      duration: 900,
      ease: 'outQuart'
    }, 1200);

    // Caption entrance
    tl.add('#caption', { opacity: [0, 1], translateY: [20, 0], duration: 800, ease: 'outQuart' }, 400);

    // Vector rotation continue
    tl.add('#qvec-1', {
      rotate: [0, 360 * 3],
      transformOrigin: '0px 0px',
      duration: 43000,
      ease: 'inOutSine'
    }, 1500);

    // Highlights
    tl.add('#hl-bit', { color: [{ to: '#38bdf8' }, { to: '#f8fafc' }], scale: [1, 1.15, 1], duration: 1100, ease: 'inOutQuint' }, 8000);
    tl.add('#hl-qubit', { color: [{ to: '#38bdf8' }, { to: '#f8fafc' }], scale: [1, 1.15, 1], duration: 1100, ease: 'inOutQuint' }, 18000);
    tl.add('#hl-measurement', { color: [{ to: '#38bdf8' }, { to: '#f8fafc' }], scale: [1, 1.15, 1], duration: 1100, ease: 'inOutQuint' }, 34000);
  </script>
</body>
</html>
